<!DOCTYPE html><html><head><meta charset="utf-8"><title>BlinkTalk recording prompter</title>
<style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;text-align:center;margin:0;padding:24px}
#act{font-size:120px;font-weight:700;height:170px;margin:30px 0}#next{font-size:22px;color:#999}#clock{font-size:28px}
button,select{font-size:20px;padding:8px 18px;margin:6px}.b{color:#7fd}.s{color:#fd7}.sos{color:#f77}.l{color:#9cf}.r{color:#c9f}</style></head><body>
<h2>BlinkTalk random-sequence prompter</h2>
<p>Start the AFE4950 capture, then press <b>Start</b> at the same moment. The time shown matches the CSV time column.</p>
<select id="seq"><option value="1">Sequence 1</option><option value="2">Sequence 2</option><option value="3">Sequence 3</option></select>
<button id="go">Start</button><button id="stop">Stop</button>
<div id="clock">0.0 s</div><div id="act">ready</div><div id="next"></div>
<script>
const SEQS={"1": [[3.0, "s"], [7.4, "sos"], [11.1, "sos"], [15.1, "b"], [18.5, "s"], [22.0, "b"], [25.1, "l"], [28.6, "s"], [32.3, "l"], [35.4, "r"], [38.8, "b"], [41.4, "r"], [44.4, "l"], [47.7, "s"], [51.8, "r"], [54.8, "sos"]], "2": [[3.0, "s"], [7.4, "sos"], [11.4, "l"], [14.3, "sos"], [18.8, "s"], [23.1, "s"], [26.9, "b"], [29.7, "r"], [32.7, "b"], [35.8, "r"], [39.0, "s"], [42.7, "r"], [45.6, "l"], [48.8, "l"], [51.8, "b"], [55.0, "l"]], "3": [[3.0, "l"], [5.6, "r"], [8.9, "s"], [12.8, "b"], [16.0, "l"], [19.0, "b"], [21.9, "sos"], [26.2, "r"], [29.6, "sos"], [33.4, "sos"], [37.4, "s"], [41.8, "sos"], [45.7, "b"], [48.3, "l"], [51.6, "s"], [55.6, "r"]]};
const NAMES={b:"BLINK",s:"SELECT (2 blinks)",sos:"3 QUICK BLINKS (on/off)",l:"LOOK LEFT",r:"LOOK RIGHT"};
let ac,timer,t0,i;
function beep(f){try{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.value=.2;o.start();o.stop(ac.currentTime+.12)}catch(e){}}
document.getElementById('go').onclick=()=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const s=SEQS[document.getElementById('seq').value];
 i=0;t0=performance.now();clearInterval(timer);
 timer=setInterval(()=>{const t=(performance.now()-t0)/1000;document.getElementById('clock').textContent=t.toFixed(1)+' s';
  if(i<s.length&&t>=s[i][0]-1.0){const a=s[i][1];const el=document.getElementById('act');
   if(t<s[i][0]){el.className='';el.textContent='get ready: '+NAMES[a]}else{el.className=a;el.textContent=NAMES[a];beep(880);i++;
    document.getElementById('next').textContent=i<s.length?'next: '+NAMES[s[i][1]]+' at '+s[i][0]+' s':'last one, keep recording to 60 s'}}
  if(t>60){clearInterval(timer);document.getElementById('act').textContent='done';beep(440)}},20)};
document.getElementById('stop').onclick=()=>{clearInterval(timer);document.getElementById('act').textContent='stopped'};
</script></body></html>
